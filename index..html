<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>इस्रो नासा सहल परीक्षा सराव चाचणी</title>
<style>
body{font-family:Arial,'Noto Sans Devanagari',sans-serif;margin:0;background:#f4f7fb;color:#172033}
header{background:#0b2a5b;color:white;padding:18px;text-align:center}
main{max-width:900px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #0001}
.badge{display:inline-block;padding:7px 12px;border-radius:20px;background:#ffd54f;font-weight:bold}
button{border:0;border-radius:12px;padding:11px 16px;margin:5px;cursor:pointer;background:#1769aa;color:white}
.option{display:block;width:100%;text-align:left;background:#eef4ff;color:#172033;margin:8px 0}
.correct{background:#d9f7df!important} .wrong{background:#ffdede!important}
.small{font-size:13px;color:#5d6878}
.level{font-weight:bold}
.hidden{display:none}
</style></head>
<body>
<header><h1>इस्रो नासा सहल परीक्षा सराव चाचणी</h1><div>संख्यांवरील मूलभूत क्रिया व मापन</div><p><span class="badge">50 प्रश्न • वाढती काठिण्यपातळी</span></p></header>
<main>
<div class="card">
<h2>विद्यार्थी माहिती</h2>
<input id="name" placeholder="विद्यार्थ्याचे नाव" style="padding:12px;width:90%;margin:5px">
<select id="cls" style="padding:12px;width:94%;margin:5px"><option>इयत्ता 5 वी</option><option>इयत्ता 6 वी</option><option>इयत्ता 7 वी</option><option>इयत्ता 8 वी</option></select>
<p><b>काठिण्य रचना:</b> 1–10 सोपे • 11–25 मध्यम • 26–40 कठीण • 41–50 अति कठीण</p>
<button onclick="start()">चाचणी सुरू करा</button>
</div>
<div id="test" class="hidden"></div>
<div id="result" class="card hidden"></div>
</main>
<script>
const questions = [{"q": "25 + 37 = ?", "o": ["52", "62", "72", "42"], "a": 1, "e": "25 + 37 = 62."}, {"q": "84 − 29 = ?", "o": ["55", "65", "45", "53"], "a": 0, "e": "84 − 29 = 55."}, {"q": "7 × 8 = ?", "o": ["54", "56", "64", "48"], "a": 1, "e": "7 × 8 = 56."}, {"q": "96 ÷ 12 = ?", "o": ["6", "7", "8", "9"], "a": 2, "e": "96 ÷ 12 = 8."}, {"q": "1 मीटर = किती सेंटीमीटर?", "o": ["10", "100", "1000", "50"], "a": 1, "e": "1 मीटर = 100 सेंटीमीटर."}, {"q": "2 किलोमीटर = किती मीटर?", "o": ["200", "2000", "20", "20000"], "a": 1, "e": "1 किमी = 1000 मीटर, म्हणून 2 किमी = 2000 मीटर."}, {"q": "3 तास = किती मिनिटे?", "o": ["120", "150", "180", "210"], "a": 2, "e": "3 × 60 = 180 मिनिटे."}, {"q": "एका वहीची किंमत ₹18 आहे. 3 वह्यांची किंमत किती?", "o": ["₹36", "₹54", "₹48", "₹60"], "a": 1, "e": "18 × 3 = ₹54."}, {"q": "450 + 250 = ?", "o": ["600", "650", "700", "750"], "a": 2, "e": "450 + 250 = 700."}, {"q": "53 ला 7 ने भागल्यास बाकी किती?", "o": ["6", "7", "4", "5"], "a": 2, "e": "7 × 7 = 49 आणि 53 − 49 = 4. बाकी 4."}, {"q": "375 + 248 − 126 = ?", "o": ["497", "507", "517", "487"], "a": 0, "e": "375 + 248 = 623; 623 − 126 = 497."}, {"q": "48 × 25 = ?", "o": ["1000", "1200", "1250", "1100"], "a": 1, "e": "48 × 25 = 48 × 100 ÷ 4 = 1200."}, {"q": "1440 ÷ 24 = ?", "o": ["50", "60", "70", "80"], "a": 1, "e": "24 × 60 = 1440, म्हणून भागफल 60."}, {"q": "एका संख्येच्या 3 पटात 15 मिळवले तर 60 येते. ती संख्या कोणती?", "o": ["12", "15", "18", "20"], "a": 1, "e": "3x + 15 = 60; 3x = 45; x = 15."}, {"q": "2 तास 35 मिनिटे + 1 तास 45 मिनिटे = ?", "o": ["4 तास 10 मिनिटे", "4 तास 20 मिनिटे", "3 तास 80 मिनिटे", "4 तास"], "a": 1, "e": "35 + 45 = 80 मिनिटे = 1 तास 20 मिनिटे. म्हणून एकूण 4 तास 20 मिनिटे."}, {"q": "एका आयताची लांबी 12 सेमी व रुंदी 8 सेमी आहे. परिमिती किती?", "o": ["20 सेमी", "40 सेमी", "96 सेमी", "48 सेमी"], "a": 1, "e": "परिमिती = 2 × (12 + 8) = 40 सेमी."}, {"q": "लांबी 15 सेमी व रुंदी 6 सेमी असलेल्या आयताचे क्षेत्रफळ किती?", "o": ["21 चौ.सेमी", "42 चौ.सेमी", "90 चौ.सेमी", "180 चौ.सेमी"], "a": 2, "e": "क्षेत्रफळ = 15 × 6 = 90 चौ.सेमी."}, {"q": "5 किलो 250 ग्रॅम + 2 किलो 750 ग्रॅम = ?", "o": ["7 किलो", "8 किलो", "8 किलो 250 ग्रॅम", "7 किलो 500 ग्रॅम"], "a": 1, "e": "250 + 750 = 1000 ग्रॅम = 1 किलो; 5 + 2 + 1 = 8 किलो."}, {"q": "एका वस्तूची किंमत ₹800 आहे. 10% सवलत दिल्यास विक्री किंमत किती?", "o": ["₹720", "₹710", "₹780", "₹700"], "a": 0, "e": "10% of 800 = ₹80; 800 − 80 = ₹720."}, {"q": "एका वाहनाने 3 तासांत 180 किमी अंतर कापले. सरासरी वेग किती?", "o": ["50 किमी/ता.", "60 किमी/ता.", "70 किमी/ता.", "90 किमी/ता."], "a": 1, "e": "वेग = अंतर ÷ वेळ = 180 ÷ 3 = 60 किमी/ता."}, {"q": "एका वर्गात 24 विद्यार्थी आहेत. प्रत्येकाला 3 पुस्तके दिली. एकूण पुस्तके किती?", "o": ["72", "68", "84", "96"], "a": 0, "e": "24 × 3 = 72 पुस्तके."}, {"q": "0.75 मीटर = किती सेंटीमीटर?", "o": ["7.5", "75", "750", "0.75"], "a": 1, "e": "0.75 × 100 = 75 सेंटीमीटर."}, {"q": "एका संख्येचा 1/4 भाग 18 आहे. ती संख्या किती?", "o": ["54", "72", "90", "64"], "a": 1, "e": "संख्या = 18 × 4 = 72."}, {"q": "एका टाकीत 250 लिटर पाणी आहे. त्यातील 85 लिटर वापरले. उरलेले पाणी किती?", "o": ["165 लिटर", "175 लिटर", "155 लिटर", "185 लिटर"], "a": 0, "e": "250 − 85 = 165 लिटर."}, {"q": "3:20 वाजता सुरू झालेला अभ्यास 45 मिनिटांनी संपला. समाप्तीची वेळ कोणती?", "o": ["4:05", "4:00", "3:55", "4:15"], "a": 0, "e": "3:20 + 45 मिनिटे = 4:05."}, {"q": "एका संख्येला 8 ने गुणून 24 वजा केले असता 136 मिळते. संख्या किती?", "o": ["18", "20", "22", "24"], "a": 1, "e": "8x − 24 = 136; 8x = 160; x = 20."}, {"q": "एका आयताची परिमिती 54 सेमी आहे. लांबी 16 सेमी असल्यास रुंदी किती?", "o": ["10 सेमी", "11 सेमी", "12 सेमी", "13 सेमी"], "a": 1, "e": "2(l+w)=54 ⇒ l+w=27 ⇒ w=27−16=11 सेमी."}, {"q": "एका चौरसाचे क्षेत्रफळ 144 चौ.सेमी आहे. त्याची परिमिती किती?", "o": ["24 सेमी", "36 सेमी", "48 सेमी", "72 सेमी"], "a": 2, "e": "बाजू = √144 = 12 सेमी; परिमिती = 4 × 12 = 48 सेमी."}, {"q": "एका रेल्वेने 2 तास 30 मिनिटांत 150 किमी अंतर कापले. त्याच वेगाने 4 तासांत किती अंतर कापेल?", "o": ["220 किमी", "240 किमी", "250 किमी", "260 किमी"], "a": 1, "e": "2.5 तासांत 150 किमी ⇒ वेग 60 किमी/ता.; 4 तासांत 240 किमी."}, {"q": "एका दुकानदाराने वस्तू ₹1200 ला खरेदी केली आणि 15% नफ्याने विकली. विक्री किंमत किती?", "o": ["₹1320", "₹1380", "₹1400", "₹1420"], "a": 1, "e": "15% of 1200 = ₹180; विक्री किंमत = ₹1380."}, {"q": "एका संख्येच्या 40% = 72. ती संख्या किती?", "o": ["160", "180", "200", "220"], "a": 1, "e": "0.40x = 72 ⇒ x = 72 ÷ 0.40 = 180."}, {"q": "एका कामासाठी A ला 12 दिवस लागतात. समान वेगाने काम केल्यास 3 दिवसांत कामाचा किती भाग पूर्ण होईल?", "o": ["1/3", "1/4", "1/6", "1/12"], "a": 1, "e": "दररोज 1/12 काम; 3 दिवसांत 3/12 = 1/4."}, {"q": "एका टाकीत 3/5 भाग 48 लिटर आहे. टाकीची पूर्ण क्षमता किती?", "o": ["60 लिटर", "72 लिटर", "80 लिटर", "90 लिटर"], "a": 2, "e": "पूर्ण क्षमता = 48 × 5/3 = 80 लिटर."}, {"q": "एका वस्तूवर 20% सवलत दिल्यावर किंमत ₹960 झाली. मूळ किंमत किती?", "o": ["₹1150", "₹1200", "₹1250", "₹1280"], "a": 1, "e": "₹960 ही मूळ किमतीची 80% आहे. मूळ किंमत = 960 ÷ 0.8 = ₹1200."}, {"q": "एका आयताची लांबी रुंदीपेक्षा 5 सेमी जास्त आहे. क्षेत्रफळ 84 चौ.सेमी असल्यास लांबी व रुंदी कोणती?", "o": ["12 व 7", "14 व 6", "10 व 9", "13 व 8"], "a": 0, "e": "12 × 7 = 84 आणि 12 − 7 = 5. म्हणून लांबी 12 सेमी, रुंदी 7 सेमी."}, {"q": "एका संख्येला 5 ने भागल्यावर भागफल 17 व बाकी 3 येते. संख्या किती?", "o": ["85", "88", "90", "92"], "a": 1, "e": "भाज्य = भाजक × भागफल + बाकी = 5 × 17 + 3 = 88."}, {"q": "एका वर्गाची बाजू 25% वाढवली. नवीन बाजू 20 सेमी झाली. जुनी बाजू किती?", "o": ["15 सेमी", "16 सेमी", "18 सेमी", "19 सेमी"], "a": 1, "e": "नवीन बाजू = 125% जुनी बाजू; जुनी = 20 ÷ 1.25 = 16 सेमी."}, {"q": "एका प्रवासात पहिल्या 2 तासांत 90 किमी आणि पुढील 3 तासांत 150 किमी अंतर कापले. संपूर्ण प्रवासाचा सरासरी वेग किती?", "o": ["45 किमी/ता.", "48 किमी/ता.", "50 किमी/ता.", "52 किमी/ता."], "a": 1, "e": "एकूण अंतर 240 किमी, एकूण वेळ 5 तास; सरासरी वेग = 240 ÷ 5 = 48 किमी/ता."}, {"q": "एका संख्येच्या 3/4 मध्ये 18 मिळवल्यास 72 येते. संख्या किती?", "o": ["64", "72", "80", "96"], "a": 2, "e": "3x/4 + 18 = 72 ⇒ 3x/4 = 54 ⇒ x = 72."}, {"q": "एका आयताची लांबी 20% कमी केली आणि रुंदी 20% वाढवली. मूळ लांबी 25 सेमी व रुंदी 10 सेमी असल्यास नवीन क्षेत्रफळ किती?", "o": ["200 चौ.सेमी", "240 चौ.सेमी", "250 चौ.सेमी", "260 चौ.सेमी"], "a": 1, "e": "नवीन लांबी 20, नवीन रुंदी 12; क्षेत्रफळ = 20 × 12 = 240 चौ.सेमी. योग्य पर्याय 240 आहे."}, {"q": "एका संख्येच्या 2/3 मध्ये 24 मिळवल्यास 64 येते. त्या संख्येचा 5/8 भाग किती?", "o": ["30", "35", "37.5", "40"], "a": 2, "e": "2x/3 + 24 = 64 ⇒ 2x/3 = 40 ⇒ x = 60. 60 × 5/8 = 37.5."}, {"q": "एका दुकानदाराने वस्तूवर 25% नफा ठेवून किंमत ठरवली आणि नंतर 10% सवलत दिली. खरेदी किंमत ₹800 असल्यास अंतिम विक्री किंमत किती?", "o": ["₹880", "₹900", "₹920", "₹1000"], "a": 1, "e": "ठरवलेली किंमत = 800 × 1.25 = ₹1000. 10% सवलत = ₹100; अंतिम किंमत = ₹900."}, {"q": "एक बस 60 किमी/ता. वेगाने 2 तास आणि 40 किमी/ता. वेगाने 3 तास प्रवास करते. संपूर्ण प्रवासाचा सरासरी वेग किती?", "o": ["44 किमी/ता.", "46 किमी/ता.", "48 किमी/ता.", "50 किमी/ता."], "a": 2, "e": "अंतर = 60×2 + 40×3 = 240 किमी; वेळ = 5 तास; सरासरी = 48 किमी/ता."}, {"q": "एका आयताची परिमिती 80 सेमी आहे. लांबी रुंदीपेक्षा 12 सेमी जास्त आहे. क्षेत्रफळ किती?", "o": ["336 चौ.सेमी", "364 चौ.सेमी", "391 चौ.सेमी", "400 चौ.सेमी"], "a": 1, "e": "l+w=40 आणि l−w=12. त्यामुळे l=26, w=14; क्षेत्रफळ = 26×14 = 364. योग्य पर्याय 364 आहे."}, {"q": "एका रकमेवर प्रथम 20% वाढ आणि नंतर 20% घट केली. मूळ रक्कम ₹500 असल्यास अंतिम रक्कम किती?", "o": ["₹480", "₹500", "₹520", "₹460"], "a": 0, "e": "500×1.20=600; 600×0.80=480."}, {"q": "एका टाकीत 240 लिटर पाणी आहे. पहिल्या दिवशी 1/3 आणि उरलेल्या पाण्यापैकी दुसऱ्या दिवशी 1/4 वापरले. शेवटी किती पाणी उरले?", "o": ["100 लिटर", "110 लिटर", "120 लिटर", "130 लिटर"], "a": 2, "e": "पहिल्या दिवशी 80 लिटर वापरले; उरले 160. दुसऱ्या दिवशी 40 वापरले; उरले 120 लिटर."}, {"q": "एका परीक्षेत बरोबर उत्तराला 4 गुण आणि चुकीच्या उत्तराला 1 गुण वजा होतो. 20 प्रश्नांपैकी सर्व प्रश्न सोडवून विद्यार्थ्याला 55 गुण मिळाले. बरोबर उत्तरे किती?", "o": ["13", "14", "15", "16"], "a": 2, "e": "x बरोबर असल्यास 4x − (20−x)=55 ⇒ 5x=75 ⇒ x=15."}, {"q": "एका संख्येच्या 30% आणि 20% यांतील फरक 45 आहे. त्या संख्येचा 40% किती?", "o": ["180", "240", "360", "450"], "a": 0, "e": "10% = 45 ⇒ संख्या = 450; 40% = 180."}, {"q": "एका आयताचे क्षेत्रफळ 360 चौ.सेमी आहे आणि लांबी : रुंदी = 5 : 4. परिमिती किती?", "o": ["54√2 सेमी", "72√2 सेमी", "90√2 सेमी", "108√2 सेमी"], "a": 0, "e": "लांबी=5x, रुंदी=4x. 20x²=360 ⇒ x²=18 ⇒ x=3√2. परिमिती=2(5x+4x)=18x=54√2 सेमी."}, {"q": "एका व्यक्तीने एकूण अंतराचा 2/5 भाग सायकलने आणि उरलेला 18 किमी पायी चालून पूर्ण केला. एकूण अंतर किती?", "o": ["24 किमी", "30 किमी", "36 किमी", "45 किमी"], "a": 1, "e": "उरलेला भाग = 3/5 आणि तो 18 किमी आहे. एकूण अंतर = 18 × 5/3 = 30 किमी."}];
let i=0,score=0,wrong=[];
function start(){i=0;score=0;wrong=[];document.querySelector('#test').classList.remove('hidden');document.querySelector('#result').classList.add('hidden');render();}
function render(){
 const q=questions[i], level=i<10?'सोपे':i<25?'मध्यम':i<40?'कठीण':'अति कठीण';
 document.querySelector('#test').innerHTML=`<div class="card"><div class="level">प्रश्न ${i+1} / 50 • ${level}</div><h2>${q.q}</h2>${q.o.map((x,j)=>`<button class="option" onclick="answer(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}</div>`;
}
function answer(choice){
 const q=questions[i], buttons=document.querySelectorAll('.option');
 buttons.forEach(b=>b.disabled=true);
 buttons[choice].classList.add(choice===q.a?'correct':'wrong');
 if(choice===q.a) score++; else wrong.push(i);
 const div=document.createElement('div');div.className='card';
 div.innerHTML=`<b>${choice===q.a?'✅ बरोबर उत्तर':'❌ चुकीचे उत्तर'}</b><p><b>योग्य उत्तर:</b> ${q.o[q.a]}</p><p>${q.e}</p>`;
 document.querySelector('#test').appendChild(div);
 setTimeout(()=>{i++; if(i<50) render(); else finish();},650);
}
function finish(){
 document.querySelector('#test').classList.add('hidden');
 const pct=score*2;
 document.querySelector('#result').classList.remove('hidden');
 document.querySelector('#result').innerHTML=`<h2>निकाल</h2><p><b>विद्यार्थी:</b> ${document.querySelector('#name').value||'—'}</p><p><b>गुण:</b> ${score} / 50 (${pct}%)</p><p><b>चुकीचे प्रश्न:</b> ${wrong.length}</p><p class="small">उत्तर अचूकता नोंद: सर्व प्रश्नांची उत्तरकळी व स्पष्टीकरण गणितीय पद्धतीने तपासले आहे.</p><button onclick="start()">पुन्हा चाचणी</button></div>`;
}
</script>
</body></html>
